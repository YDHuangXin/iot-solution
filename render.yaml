services:
  - type: web
    name: iot-solution-generator
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iot-db
          property: connectionString

databases:
  - name: iot-db
    databaseName: iot_solution_db
    plan: free
